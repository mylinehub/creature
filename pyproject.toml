[project]
name = "mathlab-mylinehub-creature"
version = "0.1.0"
description = "Connected ManimGL creature system with optional audio for the MYLINEHUB MathLab mascot"
authors = [
  { name = "mylinehub", email = "mylinehub.in@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
  "pyo",
  "manimgl",
  "numpy"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mathlab_creature*"]

[project.scripts]
creature = "mathlab_creature.cli:main"